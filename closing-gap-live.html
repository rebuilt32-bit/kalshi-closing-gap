<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Crypto Closing Gap • Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        .ticker {
            font-family: ui-monospace, monospace;
        }
        
        .progress-bar {
            transition: width 1s linear;
        }
        
        .live-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .price-line {
            height: 3px;
            background: linear-gradient(90deg, #22c55e, #eab308);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <div class="max-w-6xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-4xl font-bold tracking-tight flex items-center gap-3">
                    <span class="text-emerald-400">●</span>
                    Kalshi Crypto Closing Gap
                </h1>
                <p class="text-zinc-400 mt-1">Last 4 minutes • Velocity-based probability</p>
            </div>
            
            <div class="flex items-center gap-4">
                <div id="last-updated" class="text-xs text-zinc-500"></div>
                <button onclick="refreshData()" 
                        class="flex items-center gap-2 bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-xl text-sm transition-colors">
                    <i class="fas fa-sync"></i>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Live Calls -->
        <div id="live-section">
            <div class="flex items-center gap-2 mb-4">
                <h2 class="text-xl font-semibold">Live Markets (final 4 min)</h2>
                <div id="live-count" class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full font-mono"></div>
            </div>
            
            <div id="live-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- Backtest Summary (if available) -->
        <div id="backtest-section" class="mt-12 hidden">
            <h2 class="text-xl font-semibold mb-4">Historical Performance</h2>
            <div id="backtest-summary" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </div>

        <footer class="mt-16 text-center text-zinc-500 text-xs">
            Margin ratio = seconds needed to cross strike ÷ seconds remaining<br>
            <span class="text-emerald-400">&gt;2.0x</span> = very likely to hold • Data from closing gap analyzer
        </footer>
    </div>

    <script>
        let currentData = null;

        function classifyColor(bucket) {
            if (!bucket) return 'bg-zinc-700';
            if (['extreme', 'exceptional', 'very_high'].includes(bucket)) return 'bg-emerald-500';
            if (['high', 'moderate'].includes(bucket)) return 'bg-emerald-400';
            if (['narrow'].includes(bucket)) return 'bg-yellow-500';
            if (['coinflip'].includes(bucket)) return 'bg-orange-500';
            return 'bg-red-500';
        }

        function formatTimeLeft(seconds) {
            if (seconds <= 0) return "Closed";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        function createLiveCard(call) {
            const margin = call.margin_ratio === "infinite" ? "∞" : call.margin_ratio;
            const isSafe = call.bucket && !['losing_side', 'coinflip'].includes(call.bucket);
            
            const card = document.createElement('div');
            card.className = `bg-zinc-900 border border-zinc-800 rounded-3xl p-6 hover:border-zinc-700 transition-all duration-300`;
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-emerald-400 font-mono text-lg font-semibold ticker">${call.asset}</span>
                            <span class="text-xs bg-zinc-800 px-2 py-1 rounded-lg">${call.ticker}</span>
                        </div>
                        <div class="text-3xl font-bold mt-1 text-white">
                            $${parseFloat(call.strike).toFixed(0)}
                        </div>
                    </div>
                    
                    <div class="text-right">
                        <div class="text-xs text-zinc-400">TIME LEFT</div>
                        <div id="countdown-${call.ticker}" 
                             class="text-4xl font-mono font-bold text-emerald-400 tabular-nums">
                            ${formatTimeLeft(call.seconds_left)}
                        </div>
                    </div>
                </div>

                <!-- Price bar -->
                <div class="h-2 bg-zinc-800 rounded-full mb-6 relative overflow-hidden">
                    <div class="price-line absolute top-0 left-0 h-full" 
                         style="width: ${Math.min(100, (call.gap / (call.gap + 10)) * 100)}%"></div>
                </div>

                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div>
                        <div class="text-zinc-400 text-xs">CURRENT</div>
                        <div class="font-mono text-xl font-semibold">$${call.current_price}</div>
                    </div>
                    <div>
                        <div class="text-zinc-400 text-xs">GAP</div>
                        <div class="font-mono text-xl font-semibold">$${call.gap}</div>
                    </div>
                </div>

                <div class="mt-6 flex items-center justify-between">
                    <div>
                        <div class="flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full ${classifyColor(call.bucket)} live-dot"></div>
                            <span class="capitalize font-medium">${call.bucket || 'unknown'}</span>
                        </div>
                        <div class="text-xs text-zinc-400 mt-1">
                            ${call.safe_explanation}
                        </div>
                    </div>
                    
                    <div class="text-right">
                        <div class="text-xs text-zinc-400">MARGIN</div>
                        <div class="text-4xl font-bold font-mono ${call.margin_ratio === 'infinite' || (typeof call.margin_ratio === 'number' && call.margin_ratio > 2) ? 'text-emerald-400' : 'text-amber-400'}">
                            ${margin}x
                        </div>
                    </div>
                </div>

                ${call.safe_side ? `
                <div class="mt-4 pt-4 border-t border-zinc-800 flex items-center gap-3">
                    <div class="px-4 py-2 rounded-2xl ${call.safe_side === 'YES' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'} font-semibold">
                        ${call.safe_side} is leading
                    </div>
                </div>` : ''}
            `;
            
            return card;
        }

        function updateCountdowns() {
            if (!currentData) return;
            
            currentData.live_calls.forEach(call => {
                const el = document.getElementById(`countdown-${call.ticker}`);
                if (el) {
                    const now = Date.now();
                    const closeTime = new Date(call.close_time || Date.now() + call.seconds_left * 1000).getTime();
                    let remaining = Math.max(0, Math.floor((closeTime - now) / 1000));
                    
                    if (remaining > 0) {
                        el.textContent = formatTimeLeft(remaining);
                        
                        // Color shift as time runs out
                        if (remaining < 60) {
                            el.classList.add('text-orange-400');
                        }
                    } else {
                        el.textContent = "CLOSED";
                        el.classList.add('text-zinc-500');
                    }
                }
            });
        }

        async function loadData() {
            try {
                // Try live file first, fallback to full analysis
                let response = await fetch('data/closing_gap_live.json');
                if (!response.ok) {
                    response = await fetch('data/closing_gap_analysis.json');
                }
                
                if (!response.ok) {
                    throw new Error("No data file found");
                }
                
                currentData = await response.json();
                
                // Render live cards
                const container = document.getElementById('live-cards');
                container.innerHTML = '';
                
                if (currentData.live_calls && currentData.live_calls.length > 0) {
                    document.getElementById('live-count').textContent = `${currentData.live_calls.length} active`;
                    
                    currentData.live_calls.forEach(call => {
                        container.appendChild(createLiveCard(call));
                    });
                } else {
                    container.innerHTML = `
                        <div class="col-span-full bg-zinc-900 border border-zinc-800 rounded-3xl p-12 text-center">
                            <p class="text-zinc-400">No markets currently in final 4 minutes.</p>
                        </div>
                    `;
                }
                
                // Update timestamp
                const updatedEl = document.getElementById('last-updated');
                if (currentData.generated_at) {
                    const date = new Date(currentData.generated_at);
                    updatedEl.textContent = `Updated ${date.toLocaleTimeString()}`;
                }
                
                // Show backtest if available
                if (currentData.backtest) {
                    document.getElementById('backtest-section').classList.remove('hidden');
                    renderBacktest(currentData.backtest);
                }
                
            } catch (e) {
                console.error(e);
                document.getElementById('live-cards').innerHTML = `
                    <div class="col-span-full bg-red-950 border border-red-900 rounded-3xl p-8 text-center">
                        <i class="fas fa-exclamation-triangle text-2xl mb-4 text-red-400"></i>
                        <p class="text-red-400">Could not load data. Make sure the Python script has run.</p>
                    </div>
                `;
            }
        }

        function renderBacktest(backtest) {
            const container = document.getElementById('backtest-summary');
            container.innerHTML = '';
            
            Object.entries(backtest.by_bucket || {}).forEach(([bucket, stats]) => {
                if (!stats.n_calls) return;
                
                const winRate = stats.win_rate ? (stats.win_rate * 100).toFixed(0) : '?';
                
                const div = document.createElement('div');
                div.className = `bg-zinc-900 border border-zinc-800 rounded-3xl p-6`;
                div.innerHTML = `
                    <div class="uppercase text-xs tracking-widest text-zinc-500">${bucket}</div>
                    <div class="text-5xl font-bold mt-2">${winRate}%</div>
                    <div class="text-zinc-400 text-sm">${stats.n_calls} calls</div>
                `;
                container.appendChild(div);
            });
        }

        function refreshData() {
            const btns = document.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);
            
            loadData().finally(() => {
                setTimeout(() => {
                    btns.forEach(b => b.disabled = false);
                }, 800);
            });
        }

        // Initialize
        window.onload = () => {
            loadData();
            
            // Auto-refresh every 15 seconds
            setInterval(() => {
                if (document.visibilityState === 'visible') {
                    loadData();
                }
            }, 15000);
            
            // Countdown updater
            setInterval(updateCountdowns, 1000);
            
            // Tailwind script already loaded
        };
    </script>
</body>
</html>
