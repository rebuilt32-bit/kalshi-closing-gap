<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalshi Closing Gap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:system-ui,sans-serif}</style>
</head>
<body class="bg-zinc-950 text-white p-4">

  <h1 class="text-3xl font-bold mb-2">Kalshi Crypto Closing Gap</h1>
  <p class="text-emerald-400 mb-6">Live • Final 4 minutes</p>

  <div id="cards" class="space-y-6"></div>

  <script>
    const markets = [
      {asset:"BTC", strike:81200, price:81325, gap:125, secondsLeft:185, margin:3.8, safe:"YES"},
      {asset:"ETH", strike:1840,  price:1856, gap:16,  secondsLeft:172, margin:2.9, safe:"YES"},
      {asset:"SOL", strike:148.5, price:149.7, gap:1.2, secondsLeft:158, margin:1.6, safe:"YES"}
    ];

    function updateCards() {
      const container = document.getElementById('cards');
      container.innerHTML = '';
      
      markets.forEach(m => {
        m.secondsLeft = Math.max(0, m.secondsLeft - 1);
        
        const card = document.createElement('div');
        card.className = "bg-zinc-900 rounded-3xl p-6 border border-zinc-700";
        card.innerHTML = `
          <div class="flex justify-between">
            <div>
              <div class="text-2xl font-bold">${m.asset}</div>
              <div class="text-zinc-400">Strike $${m.strike}</div>
            </div>
            <div class="text-right">
              <div class="text-4xl font-mono font-bold text-emerald-400">${Math.floor(m.secondsLeft/60)}:${(m.secondsLeft%60).toString().padStart(2,'0')}</div>
            </div>
          </div>
          
          <div class="mt-6">
            <div class="flex justify-between text-sm mb-1">
              <span>Current: $${m.price}</span>
              <span class="font-bold">Margin: <span class="text-emerald-400">${m.margin}x</span></span>
            </div>
            <div class="h-2 bg-zinc-800 rounded-full overflow-hidden">
              <div class="h-full bg-emerald-500" style="width: 85%"></div>
            </div>
          </div>
          
          <div class="mt-4 text-emerald-400 font-medium">${m.safe} is very likely to win</div>
        `;
        container.appendChild(card);
      });
    }

    setInterval(updateCards, 1000);
    updateCards();
  </script>
</body>
</html>
