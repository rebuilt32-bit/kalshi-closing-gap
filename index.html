<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalshi Live Closing Gap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-4xl font-bold mb-1">Kalshi Crypto Closing Gap</h1>
    <p class="text-emerald-400 mb-8">Live • Pulling real prices • Final 4 minutes</p>

    <div id="status" class="text-sm mb-6 text-zinc-400"></div>
    <div id="cards" class="space-y-6"></div>
  </div>

  <script>
    async function fetchKalshiMarkets() {
      try {
        const res = await fetch('https://external-api.kalshi.com/trade-api/v2/markets?limit=100&status=open');
        const data = await res.json();
        
        // Filter for 15-min crypto markets
        return data.markets.filter(m => 
          m.ticker.includes('15M') && 
          (m.ticker.includes('BTC') || m.ticker.includes('ETH') || m.ticker.includes('SOL'))
        );
      } catch(e) {
        console.error(e);
        return [];
      }
    }

    async function getCryptoPrice(symbol) {
      const apis = {
        'BTC': 'https://api.coinbase.com/v2/prices/BTC-USD/spot',
        'ETH': 'https://api.coinbase.com/v2/prices/ETH-USD/spot',
        'SOL': 'https://api.binance.com/api/v3/ticker/price?symbol=SOLUSDT'
      };
      
      try {
        const res = await fetch(apis[symbol] || apis['BTC']);
        const data = await res.json();
        return parseFloat(data.price || data.data?.amount || data.price);
      } catch(e) {
        return null;
      }
    }

    async function updateDashboard() {
      const status = document.getElementById('status');
      status.textContent = "Fetching live markets...";
      
      const markets = await fetchKalshiMarkets();
      const cardsContainer = document.getElementById('cards');
      cardsContainer.innerHTML = '';

      if (markets.length === 0) {
        status.innerHTML = `<span class="text-amber-400">No active 15-min crypto markets found right now.</span>`;
        return;
      }

      status.textContent = `Found ${markets.length} active markets • Updating...`;

      for (const market of markets) {
        const asset = market.ticker.includes('BTC') ? 'BTC' : 
                     market.ticker.includes('ETH') ? 'ETH' : 'SOL';
        
        const currentPrice = await getCryptoPrice(asset);
        if (!currentPrice) continue;

        const strike = parseFloat(market.close_price || market.strike || 0);
        const secondsLeft = Math.max(0, Math.floor((new Date(market.close_time) - Date.now()) / 1000));

        if (secondsLeft > 240 || secondsLeft <= 0) continue; // Only final 4 min

        const gap = Math.abs(currentPrice - strike);
        const margin = secondsLeft > 0 ? "Live" : "Closed";

        const card = document.createElement('div');
        card.className = "bg-zinc-900 border border-zinc-700 rounded-3xl p-6";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <div class="text-3xl font-bold">${asset}</div>
              <div class="text-zinc-400">Strike <span class="font-mono">$${strike.toFixed(2)}</span></div>
            </div>
            <div class="text-right">
              <div class="text-5xl font-mono font-bold text-emerald-400" id="count-${market.ticker}">
                ${Math.floor(secondsLeft/60)}:${(secondsLeft%60).toString().padStart(2,'0')}
              </div>
            </div>
          </div>
          
          <div class="mt-8 grid grid-cols-2 gap-6 text-sm">
            <div>
              <div class="text-zinc-400">Current Price</div>
              <div class="text-2xl font-semibold">$${currentPrice.toFixed(2)}</div>
            </div>
            <div>
              <div class="text-zinc-400">Gap</div>
              <div class="text-2xl font-semibold">$${gap.toFixed(2)}</div>
            </div>
          </div>
          
          <div class="mt-6 pt-4 border-t border-zinc-700 flex items-center justify-between">
            <div class="text-emerald-400 font-medium">Margin: <span class="font-mono text-xl">${margin}</span></div>
            <div class="text-xs bg-emerald-900 text-emerald-300 px-3 py-1 rounded-full">${market.ticker}</div>
          </div>
        `;
        cardsContainer.appendChild(card);
      }
    }

    // Auto update every 15 seconds
    updateDashboard();
    setInterval(updateDashboard, 15000);

    // Countdown updater
    setInterval(() => {
      document.querySelectorAll('[id^="count-"]').forEach(el => {
        let time = el.textContent.split(':').map(Number);
        let seconds = time[0]*60 + time[1] - 1;
        if (seconds >= 0) {
          el.textContent = `${Math.floor(seconds/60)}:${(seconds%60).toString().padStart(2,'0')}`;
        }
      });
    }, 1000);
  </script>
</body>
</html>
