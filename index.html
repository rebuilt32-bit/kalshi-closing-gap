<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalshi Closing Gap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white p-4 min-h-screen">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-4xl font-bold mb-1">Kalshi Crypto Closing Gap</h1>
    <p class="text-emerald-400 mb-6">Final 4 minutes • Real data</p>

    <div id="status" class="mb-6 text-sm"></div>
    <div id="cards" class="space-y-6"></div>
  </div>

  <script>
    async function getPrice(symbol) {
      try {
        if (symbol === 'BTC') {
          const r = await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot');
          const d = await r.json();
          return parseFloat(d.data.amount);
        } else if (symbol === 'ETH') {
          const r = await fetch('https://api.coinbase.com/v2/prices/ETH-USD/spot');
          const d = await r.json();
          return parseFloat(d.data.amount);
        } else if (symbol === 'SOL') {
          const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=SOLUSDT');
          const d = await r.json();
          return parseFloat(d.price);
        }
      } catch(e) {}
      return null;
    }

    async function updateDashboard() {
      const status = document.getElementById('status');
      status.innerHTML = 'Fetching live Kalshi markets...';

      try {
        const res = await fetch('https://external-api.kalshi.com/trade-api/v2/markets?status=open&limit=200');
        const data = await res.json();

        const cryptoMarkets = data.markets.filter(m => 
          ['BTC','ETH','SOL'].some(c => m.ticker.includes(c)) && 
          m.ticker.includes('15M')
        );

        const container = document.getElementById('cards');
        container.innerHTML = '';

        if (cryptoMarkets.length === 0) {
          status.innerHTML = `<span class="text-amber-400">No active 15-min crypto markets right now.</span>`;
          return;
        }

        status.innerHTML = `Found ${cryptoMarkets.length} active markets`;

        for (const m of cryptoMarkets) {
          const asset = m.ticker.includes('BTC') ? 'BTC' : m.ticker.includes('ETH') ? 'ETH' : 'SOL';
          const price = await getPrice(asset);
          if (!price) continue;

          const strike = m.close_price || m.strike || 0;
          const closeTime = new Date(m.close_time);
          const secondsLeft = Math.max(0, Math.floor((closeTime - Date.now()) / 1000));

          if (secondsLeft > 240 || secondsLeft === 0) continue;

          const gap = (price - strike).toFixed(2);
          const margin = (secondsLeft > 60) ? (secondsLeft / 60).toFixed(1) + "x" : "Tight";

          const card = document.createElement('div');
          card.className = "bg-zinc-900 rounded-3xl p-6 border border-zinc-700";
          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <div class="text-4xl font-bold">${asset}</div>
                <div class="text-zinc-400">Strike <span class="font-mono">$${parseFloat(strike).toFixed(2)}</span></div>
              </div>
              <div class="text-right">
                <div class="font-mono text-5xl font-bold text-emerald-400 countdown">${Math.floor(secondsLeft/60)}:${(secondsLeft%60).toString().padStart(2,'0')}</div>
              </div>
            </div>

            <div class="mt-8 grid grid-cols-2 gap-6">
              <div>
                <div class="text-xs text-zinc-400">NOW</div>
                <div class="text-3xl font-semibold">$${price.toFixed(2)}</div>
              </div>
              <div>
                <div class="text-xs text-zinc-400">GAP</div>
                <div class="text-3xl font-semibold ${gap > 0 ? 'text-emerald-400' : 'text-red-400'}">$${gap}</div>
              </div>
            </div>

            <div class="mt-6 pt-4 border-t border-zinc-700 flex justify-between items-center">
              <div class="text-emerald-400 font-bold">${margin} margin</div>
              <div class="text-xs bg-zinc-800 px-3 py-1 rounded-full">${m.ticker}</div>
            </div>
          `;
          container.appendChild(card);
        }
      } catch(e) {
        status.innerHTML = 'Error fetching data. Trying again...';
      }
    }

    updateDashboard();
    setInterval(updateDashboard, 15000);

    // Countdown
    setInterval(() => {
      document.querySelectorAll('.countdown').forEach(el => {
        let [m, s] = el.textContent.split(':').map(Number);
        let total = m*60 + s - 1;
        if (total >= 0) el.textContent = `${Math.floor(total/60)}:${(total%60).toString().padStart(2,'0')}`;
      });
    }, 1000);
  </script>
</body>
</html>
